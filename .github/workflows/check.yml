name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - name: Export build SHA
        shell: bash
        run: |
          echo "EXPO_PUBLIC_GIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "GIT_COMMIT=${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Verify V1 (shared manifest)
        run: npm run verify:v1
        env:
          CI: true
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}
      - name: Upload verify summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-v1-summary
          path: .dev-data/verify/latest-summary.json
          if-no-files-found: warn
