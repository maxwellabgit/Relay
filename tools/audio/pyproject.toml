[project]
name = "relay-audio"
version = "0.1.0"
description = "WhisperX preprocessing for RELAY recorded-audio fixtures"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
relay-audio-prepare = "relay_audio.prepare:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["relay_audio*"]
